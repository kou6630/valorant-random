<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VALORANT ランダムキャラツール</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- ホーム画面 -->
    <section id="screen-home" class="screen active">
      <h1>VALORANT ランダムキャラツール</h1>

      <div class="panel">
        <label for="playerName">名前</label>
        <input id="playerName" type="text" maxlength="20" placeholder="名前を入力" autocomplete="name" spellcheck="false" />

        <label for="roomPass">合言葉</label>
        <input id="roomPass" type="text" maxlength="10" placeholder="合言葉を入力" autocomplete="off" autocapitalize="off" spellcheck="false" />

        <div class="button-group">
          <button id="joinRoomBtn" type="button">ロビー参加</button>
          <button id="openAgentSettingsBtn" type="button">未開放エージェント設定</button>
        </div>
      </div>
    </section>

    <!-- 未開放エージェント設定画面 -->
    <section id="screen-agent-settings" class="screen">
      <h2>未開放エージェント設定</h2>

      <div class="panel">
        <div class="button-group">
          <button id="setAllAgentsOwnedBtn" type="button">全エージェント持ち</button>
          <button id="saveAgentSettingsBtn" type="button">保存</button>
          <button id="backToHomeFromSettingsBtn" type="button">戻る</button>
        </div>

        <div id="agentSettingsList" class="agent-grid"></div>
      </div>
    </section>

    <!-- ロビー画面 -->
    <section id="screen-lobby" class="screen">
      <h2>ロビー</h2>

      <div class="panel">
        <p>合言葉: <span id="lobbyRoomPass" aria-live="polite">-</span></p>
        <p>オーナー: <span id="lobbyOwnerName" aria-live="polite">-</span></p>

        <div class="lobby-columns">
          <div class="lobby-block">
            <h3>参加者</h3>
            <ul id="playerList" class="member-list" aria-live="polite"></ul>
          </div>
        </div>

        <div class="button-group">
          <button id="readyBtn" type="button">準備完了</button>
          <button id="cancelReadyBtn" type="button">準備解除</button>
          <button id="goToStageSelectBtn" type="button" disabled>ステージ選択</button>
        </div>
      </div>
    </section>

    <!-- ステージ選択画面 -->
    <section id="screen-stage-select" class="screen">
      <h2>ステージ選択</h2>

      <div class="panel">
        <label for="stageSelect">ステージ</label>
        <select id="stageSelect"></select>

        <label for="roleCompSelect">役職割</label>
        <select id="roleCompSelect"></select>

        <div class="button-group">
          <button id="randomRoleCompBtn" type="button">役職割ランダム</button>
          <button id="startDrawBtn" type="button">抽選開始</button>
          <button id="backToLobbyFromStageBtn" type="button">ロビーへ戻る</button>
        </div>
      </div>
    </section>

    <!-- 個人演出画面 -->
    <section id="screen-draw" class="screen">
      <h2>個人演出</h2>

      <div class="panel center-panel">
        <div id="drawAnimationArea" aria-live="polite">確定結果を演出表示します</div>
      </div>
    </section>

    <!-- 個人結果画面 -->
    <section id="screen-personal-result" class="screen">
      <h2>あなたはこのキャラになりました</h2>

      <div class="panel center-panel">
        <img id="personalAgentImage" src="" alt="agent" class="agent-result-image" loading="lazy" decoding="async" />
        <p id="personalAgentName" aria-live="polite">-</p>
        <p id="personalResultAutoText">このあと自動で全体結果へ移動します</p>
        <button id="toAllResultsBtn" type="button" hidden aria-hidden="true" tabindex="-1">全体結果へ</button>
      </div>
    </section>

    <!-- 全体結果画面 -->
    <section id="screen-all-results" class="screen">
      <h2>全体結果</h2>

      <div class="panel">
        <div id="allResultsList" class="results-grid" aria-live="polite"></div>

        <div class="button-group">
          <button id="rerollBtn" type="button" hidden aria-hidden="true" tabindex="-1">再抽選</button>
          <button id="backToLobbyBtn" type="button">ホームへ</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
